name: Model runtime checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  python-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile AI server modules
        working-directory: ai-server
        run: python -m py_compile server.py compatibility.py
      - name: Run compatibility analyzer tests
        working-directory: ai-server
        run: python -m unittest -v test_compatibility.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Build frontend
        working-directory: app
        run: npm run build
