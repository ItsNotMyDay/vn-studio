name: Model runtime checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  python-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile AI server modules
        working-directory: ai-server
        run: python -m py_compile server.py compatibility.py audio_runtime.py quantization_cache.py
      - name: Run compatibility analyzer tests
        working-directory: ai-server
        run: python -m unittest -v test_compatibility.py test_audio_runtime.py test_quantization_cache.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Build frontend
        working-directory: app
        run: npm run build

  tauri-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - name: Build frontend assets
        working-directory: app
        run: npm run build
      - name: Check Windows Tauri application
        run: cargo check --manifest-path app/src-tauri/Cargo.toml
